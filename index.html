<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>수학 문제풀이 튜터링 시스템</title>

    <link rel="stylesheet" href="./indexStyles.css" />
    <script type="module" src="/src/main.js"></script>
  </head>

  <body>
    <main class="login-page">
      <section class="login-card" aria-label="학생 로그인">
        <div class="card-header">
          <p class="eyebrow">Student Login</p>
          <h1>학생 로그인</h1>
          <p>반과 번호를 입력한 뒤 학습을 시작해 주세요.</p>
        </div>

        <form id="studentLoginForm" class="login-form" autocomplete="off" novalidate>
          <div class="form-group">
            <label for="classNumber">반</label>
            <input
              id="classNumber"
              name="classNumber"
              type="number"
              min="1"
              step="1"
              placeholder="예: 3"
              autocomplete="off"
              required
            />
          </div>

          <div class="form-group">
            <label for="studentNumber">번호</label>
            <input
              id="studentNumber"
              name="studentNumber"
              type="number"
              min="1"
              step="1"
              placeholder="예: 7"
              autocomplete="off"
              required
            />
          </div>

          <p id="loginMessage" class="login-message" aria-live="polite"></p>

          <button id="loginButton" class="login-button" type="submit">
            로그인하고 시작하기
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
